<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Iris Ghost — Discord</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 "Segoe UI", system-ui, sans-serif; background: #15161a; color: #e9e9ee; }
  main { max-width: 34rem; padding: 2rem 1.5rem; text-align: center; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .75rem; }
  p { margin: .5rem 0; color: #b9b9c4; }
  code { display: block; margin: 1rem 0; padding: .75rem; border-radius: 8px; background: #22232a;
         color: #e9e9ee; word-break: break-all; font-size: .9rem; user-select: all; }
  .err { color: #ff8a80; }
  .muted { font-size: .85rem; color: #85858f; }
</style>
</head>
<body>
<main>
  <h1 id="titre">Liaison en cours…</h1>
  <p id="texte">Tu vas être renvoyé vers l'application.</p>
  <div id="repli" hidden>
    <p>L'application n'a pas répondu. Copie ce code et colle-le dans Iris Ghost :</p>
    <code id="code"></code>
  </div>
  <p class="muted">Cette page ne garde rien et ne note rien. Elle sert uniquement à renvoyer le code
    d'autorisation vers l'application installée sur ton ordinateur.</p>
</main>
<script>
/* Page de retour Discord d'Iris Ghost (docs/spectre-relais.md §6, étape 1).
 *
 * Même rôle et mêmes règles que `callback.html` pour Bungie : Discord n'accepte qu'un petit nombre
 * d'URL de redirection, et elles doivent être en https — ce qu'un `https://localhost` auto-signé ne
 * peut pas offrir sans avertissement. Cette page statique reçoit donc le retour de Discord et le
 * repasse aussitôt à l'application locale.
 *
 * ⚠️ **Le code ne vaut rien ici, et c'est voulu.** L'échanger contre un jeton demande le *client
 * secret* de l'application Discord, qui est sur le relais et nulle part ailleurs — ni dans cette page,
 * ni dans l'application du joueur. Cette page ne fait que transporter.
 *
 * Le port de l'application voyage dans `state`, sous la forme `<port>.<aléa>` : c'est l'application
 * qui l'a choisi, et c'est elle qui vérifie l'aléa au retour. La page, elle, ne fait confiance à rien :
 *  - elle n'accepte que le motif exact (chiffres, point, aléa) ;
 *  - elle ne construit QUE des URL vers 127.0.0.1, jamais vers autre chose. Ce n'est donc pas un
 *    redirecteur ouvert, même si quelqu'un lui fabrique une adresse à la main ;
 *  - elle ne stocke rien, n'appelle rien, ne journalise rien.
 */
(function () {
  var titre = document.getElementById("titre");
  var texte = document.getElementById("texte");
  var p = new URLSearchParams(location.search);
  var code = p.get("code") || "";
  var state = p.get("state") || "";
  var erreur = p.get("error") || "";

  function echec(message) {
    titre.textContent = "Liaison impossible";
    titre.className = "err";
    texte.textContent = message;
  }

  if (erreur) {
    // `access_denied` = le joueur a cliqué « Annuler » sur l'écran de Discord. Ce n'est pas une panne,
    // et le lui présenter comme telle serait lui faire chercher un problème qui n'existe pas.
    echec(erreur === "access_denied"
      ? "Tu as refusé l'autorisation. Relance la liaison depuis Iris Ghost si tu changes d'avis."
      : "Discord a refusé l'autorisation (" + erreur + "). Relance la liaison depuis l'application.");
    return;
  }
  if (!code) { echec("Aucun code d'autorisation reçu. Relance la liaison depuis l'application."); return; }

  // `state` : le port de l'application, un « s » si elle sert en TLS, un point, puis son aléa.
  //
  // Le « s » n'est pas une coquetterie. L'application **installée** sert en clair sur un port tiré au
  // hasard ; `da web`, l'édition de développement, sert en **HTTPS** sur 7777. Sans ce marqueur, la
  // page renvoyait tout le monde en `http://` et le navigateur affichait « 127.0.0.1 n'a envoyé
  // aucune donnée » — juste après que le joueur a cliqué « Autoriser », quand il a déjà tout accordé
  // et qu'il n'y a plus rien à rattraper (relevé le 16/11).
  var m = /^([0-9]{2,5})(s?)\.([A-Za-z0-9_-]{16,64})$/.exec(state);
  if (!m) { echec("Retour inattendu : relance la liaison depuis l'application."); return; }
  var port = parseInt(m[1], 10);
  if (!(port > 0 && port < 65536)) { echec("Retour inattendu : relance la liaison depuis l'application."); return; }

  // La seule destination possible, construite ici — jamais reprise de l'adresse. Le schéma vient du
  // marqueur, pas d'un champ : il n'y a que deux valeurs possibles, et aucune ne vient de l'extérieur.
  var cible = (m[2] === "s" ? "https" : "http") + "://127.0.0.1:" + port
            + "/discord/callback?code=" + encodeURIComponent(code)
            + "&state=" + encodeURIComponent(state);

  // Si l'application ne prend pas la main en quelques secondes, on montre le code à coller.
  var repli = setTimeout(function () {
    document.getElementById("code").textContent = code;
    document.getElementById("repli").hidden = false;
    titre.textContent = "Presque fini";
    texte.textContent = "L'application n'a pas répondu.";
  }, 4000);

  window.addEventListener("pagehide", function () { clearTimeout(repli); });
  location.replace(cible);
})();
</script>
</body>
</html>
